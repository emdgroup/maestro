<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maestro home dashboard: approved mock</title>
    <!-- Standalone copy of the canvas the design was approved on. Open it in a browser.
     Tokens are the app's light theme from src/index.css; add class="dark" on <html> for dark. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-border: var(--border);
      }
      :root {
        --background: oklch(98% 0.015 70);
        --foreground: oklch(45% 0.01 250);
        --card: oklch(99.5% 0.01 70);
        --muted: oklch(94% 0.015 70);
        --muted-foreground: oklch(45% 0.01 250);
        --primary: oklch(0% 0 0);
        --primary-foreground: oklch(100% 0 0);
        --border: oklch(90% 0.01 70);
        --accent: oklch(50% 0.15 250);
      }
      .dark {
        --background: oklch(20% 0.01 250);
        --foreground: oklch(92% 0.01 250);
        --card: oklch(24% 0.01 250);
        --muted: oklch(28% 0.01 250);
        --muted-foreground: oklch(70% 0.01 250);
        --primary: oklch(96% 0 0);
        --primary-foreground: oklch(15% 0 0);
        --border: oklch(32% 0.01 250);
        --accent: oklch(75% 0.15 250);
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <style>
      #stage {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        min-height: 900px;
        background: var(--background);
      }
      #stage .tint {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 70% at 25% 0%,
            color-mix(in oklab, var(--accent) 40%, transparent),
            transparent 70%
          ),
          radial-gradient(
            70% 55% at 100% 35%,
            color-mix(in oklab, var(--accent) 22%, transparent),
            transparent 70%
          );
        pointer-events: none;
      }
      #stage .bubbles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #stage .b {
        position: absolute;
        bottom: -40px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 30%,
          color-mix(in oklab, var(--accent) 30%, white),
          color-mix(in oklab, var(--accent) 70%, transparent) 62%
        );
        opacity: 0.45;
        animation: rise linear infinite;
      }
      @keyframes rise {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        10% {
          opacity: 0.45;
        }
        50% {
          transform: translate(14px, -460px);
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translate(-6px, -960px);
          opacity: 0;
        }
      }
      .glass {
        background: color-mix(in oklab, var(--card) 42%, transparent);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        backdrop-filter: blur(20px) saturate(150%);
        border: 1px solid color-mix(in oklab, var(--foreground) 9%, transparent);
        box-shadow:
          0 1px 0 color-mix(in oklab, white 20%, transparent) inset,
          0 18px 40px -24px rgb(0 0 0/0.35);
      }
      .glass-strong {
        background: color-mix(in oklab, var(--card) 72%, transparent);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        border: 1px solid color-mix(in oklab, var(--foreground) 11%, transparent);
        box-shadow:
          0 1px 0 color-mix(in oklab, white 20%, transparent) inset,
          0 20px 50px -18px rgb(0 0 0/0.45);
      }
      .pane {
        background: color-mix(in oklab, var(--background) 28%, transparent);
        border: 1px solid color-mix(in oklab, var(--foreground) 7%, transparent);
        transition:
          background 0.18s,
          transform 0.18s,
          border-color 0.18s;
      }
      .pane:hover {
        background: color-mix(in oklab, var(--background) 62%, transparent);
        transform: translateY(-2px);
        border-color: color-mix(in oklab, var(--foreground) 14%, transparent);
      }
      .pane.sel {
        border-color: color-mix(in oklab, var(--accent) 70%, transparent);
        background: color-mix(in oklab, var(--accent) 10%, transparent);
        transform: none;
      }
      .pane.attn {
        background: color-mix(
          in oklab,
          #f59e0b 13%,
          color-mix(in oklab, var(--background) 30%, transparent)
        );
        border-color: color-mix(in oklab, #f59e0b 34%, transparent);
      }
      .pane.attn:hover {
        background: color-mix(
          in oklab,
          #f59e0b 19%,
          color-mix(in oklab, var(--background) 45%, transparent)
        );
        border-color: color-mix(in oklab, #f59e0b 48%, transparent);
      }
      .ghost {
        border: 1.5px dashed color-mix(in oklab, var(--foreground) 18%, transparent);
        transition:
          border-color 0.18s,
          background 0.18s,
          color 0.18s;
      }
      .ghost:hover {
        border-color: color-mix(in oklab, var(--accent) 70%, transparent);
        background: color-mix(in oklab, var(--accent) 8%, transparent);
        color: var(--foreground);
      }
      /* working is the accent colour, review the Review column's purple-500 */
      .c-work {
        color: var(--accent);
      }
      .c-review {
        color: var(--color-purple-500, oklch(62.7% 0.265 303.9));
      }
      /* A panel draws its glass on ::before. An element with backdrop-filter is a backdrop root, so
         a menu or hover card inside the panel itself could only blur the panel, not what lies
         under it; on a pseudo-element the panel stays transparent to its popups' blur. */
      section.glass {
        position: relative;
        isolation: isolate;
        background: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        box-shadow: 0 18px 40px -24px rgb(0 0 0/0.35);
      }
      section.glass::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
        background: color-mix(in oklab, var(--card) 30%, transparent);
        -webkit-backdrop-filter: blur(8px) saturate(140%);
        backdrop-filter: blur(8px) saturate(140%);
        box-shadow: 0 1px 0 color-mix(in oklab, white 20%, transparent) inset;
      }
      .pop {
        box-shadow:
          0 1px 0 color-mix(in oklab, white 20%, transparent) inset,
          0 20px 50px -18px rgb(0 0 0/0.35);
      }
      /* integration tiles and their hover card */
      .card {
        display: none;
        position: absolute;
        left: -8px;
        top: 42px;
        padding-top: 8px;
        z-index: 20;
      }
      .wrap:hover .card,
      .wrap.pinned .card {
        display: block;
      }
      #integrations.has-pin .wrap:not(.pinned):hover .card {
        display: none;
      }
      .card > div {
        animation: drop 0.14s ease-out;
        transform-origin: top left;
      }
      .wrap:hover .tile,
      .wrap.pinned .tile {
        transform: translateY(-2px);
        border-color: color-mix(in oklab, var(--accent) 60%, transparent);
      }
      .wrap.pinned .tile {
        box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 35%, transparent);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 9px;
        border-radius: 10px;
        text-align: left;
        cursor: pointer;
      }
      .row:hover {
        background: color-mix(in oklab, var(--foreground) 7%, transparent);
      }
      .ico {
        object-fit: contain;
      }
      .dark .ico.mono {
        filter: invert(1);
      }
      .badge {
        position: absolute;
        right: -5px;
        top: -5px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        font-size: 10px;
        font-weight: 600;
        display: grid;
        place-items: center;
        background: var(--foreground);
        color: var(--background);
      }
      .cap {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 6px;
        background: color-mix(in oklab, var(--foreground) 7%, transparent);
        color: var(--muted-foreground);
      }
      .logo {
        filter: drop-shadow(0 6px 14px rgb(0 0 0/0.18));
      }
      .hl {
        letter-spacing: -0.025em;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .pill {
        background: color-mix(in oklab, var(--card) 50%, transparent);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent);
      }
      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .field {
        background: color-mix(in oklab, var(--background) 55%, transparent);
        border: 1px solid color-mix(in oklab, var(--foreground) 12%, transparent);
      }
      .field:focus {
        outline: none;
        border-color: color-mix(in oklab, var(--accent) 70%, transparent);
      }
      .seg {
        background: color-mix(in oklab, var(--background) 45%, transparent);
        border: 1px solid color-mix(in oklab, var(--foreground) 9%, transparent);
      }
      .seg button.on {
        background: color-mix(in oklab, var(--card) 90%, transparent);
        box-shadow: 0 1px 3px rgb(0 0 0/0.15);
      }
      .scrim {
        background: color-mix(in oklab, var(--background) 30%, transparent);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      .sheet {
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
      }
      .menu {
        animation: drop 0.14s ease-out;
        transform-origin: top right;
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(-4px);
        }
      }
      .mi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 10px;
        border-radius: 10px;
        text-align: left;
        cursor: pointer;
      }
      .mi:hover {
        background: color-mix(in oklab, var(--foreground) 8%, transparent);
      }
      .mi svg {
        opacity: 0.7;
      }
      .mi.danger {
        color: #e11d48;
      }
      .mi.danger:hover {
        background: color-mix(in oklab, #e11d48 12%, transparent);
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .reveal {
        animation: reveal 0.25s ease-out;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .shake {
        animation: shake 0.3s;
      }
      @keyframes shake {
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
    </style>
    <div id="root" class="p-3 text-foreground text-sm">
      <div
        id="stage"
        onclick="
          if (menuOpen && !event.target.closest('.menu-wrap')) {
            menuOpen = null;
            render();
          }
        "
      >
        <span class="tint"></span><span class="bubbles" id="bubbles"></span>

        <div id="corner" class="absolute top-0 inset-x-0 h-14 flex items-center gap-2 px-4 z-10">
          <span class="ml-auto flex items-center gap-3 px-2 text-muted-foreground text-xs"
            ><span>●</span><span>◐</span><span>⚙</span><span class="opacity-60">─ ▢ ✕</span></span
          >
        </div>

        <main class="relative z-10 px-12 pt-20 pb-14 max-w-[1200px] mx-auto">
          <section id="hero" class="mb-12 flex items-end gap-12">
            <div class="flex items-center gap-4">
              <img
                id="logo"
                class="logo h-16 w-16 object-contain"
                src="../../public/maestro-logo.png"
                alt="Maestro"
              />
              <div>
                <h1 class="hl text-[28px] leading-none font-semibold">Maestro</h1>
                <div id="sub" class="text-xs text-muted-foreground mt-1.5">
                  Conduct your agents in concert
                </div>
              </div>
            </div>
            <div id="scores" class="ml-auto flex gap-10"></div>
          </section>
          <div class="grid grid-cols-2 gap-5 mb-5">
            <section id="add-connection" class="glass rounded-[22px] p-5">
              <div class="text-sm font-medium text-foreground">Add a connection</div>
              <div class="text-xs text-muted-foreground mt-0.5">Where your project lives</div>
              <div class="flex gap-2 mt-4" id="add-conn-types"></div>
            </section>
            <section id="integrations" class="glass rounded-[22px] p-5 relative z-10"></section>
          </div>
          <div id="connections" class="grid grid-cols-2 gap-5"></div>
        </main>

        <div
          id="proj-scrim"
          style="display: none"
          onclick="if (event.target === this) hide('proj-scrim');"
          class="scrim absolute inset-0 z-30 flex items-start justify-center pt-40"
        >
          <div class="sheet glass rounded-[22px] w-[620px] p-6">
            <div class="flex items-start">
              <div>
                <div
                  class="text-[11px] uppercase tracking-[0.14em] text-muted-foreground"
                  id="proj-conn"
                ></div>
                <div class="hl text-2xl font-semibold mt-0.5">Add a project</div>
              </div>
              <button
                id="proj-close"
                onclick="hide('proj-scrim')"
                class="ml-auto h-7 w-7 rounded-full grid place-items-center text-muted-foreground hover:bg-foreground/10 cursor-pointer"
              >
                ✕
              </button>
            </div>
            <div class="grid grid-cols-3 gap-3 mt-5">
              <button
                id="opt-open"
                onclick="pickProj('open')"
                class="pane rounded-2xl p-4 text-left cursor-pointer"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <path
                    d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                  />
                </svg>
                <div class="font-medium mt-3">Open a folder</div>
                <div class="text-xs text-muted-foreground mt-0.5">
                  A repository already on this machine
                </div>
              </button>
              <button
                id="opt-clone"
                onclick="pickProj('clone')"
                class="pane rounded-2xl p-4 text-left cursor-pointer"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <circle cx="6" cy="5" r="2" />
                  <circle cx="18" cy="5" r="2" />
                  <circle cx="12" cy="19" r="2" />
                  <path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5" />
                </svg>
                <div class="font-medium mt-3">Clone</div>
                <div class="text-xs text-muted-foreground mt-0.5">From GitHub or any git URL</div>
              </button>
              <button
                id="opt-create"
                onclick="pickProj('create')"
                class="pane rounded-2xl p-4 text-left cursor-pointer"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                <div class="font-medium mt-3">Start fresh</div>
                <div class="text-xs text-muted-foreground mt-0.5">A new, empty repository</div>
              </button>
            </div>
            <div id="proj-detail" class="mt-4"></div>
          </div>
        </div>

        <div
          id="conn-scrim"
          style="display: none"
          onclick="if (event.target === this) hide('conn-scrim');"
          class="scrim absolute inset-0 z-30 flex items-start justify-center pt-32"
        >
          <div class="sheet glass rounded-[22px] w-[560px] p-6">
            <div class="flex items-start">
              <div>
                <div class="text-[11px] uppercase tracking-[0.14em] text-muted-foreground">
                  Add a connection
                </div>
                <div id="conn-title" class="hl text-2xl font-semibold mt-0.5"></div>
              </div>
              <button
                id="conn-close"
                onclick="hide('conn-scrim')"
                class="ml-auto h-7 w-7 rounded-full grid place-items-center text-muted-foreground hover:bg-foreground/10 cursor-pointer"
              >
                ✕
              </button>
            </div>
            <div id="conn-body" class="mt-5"></div>
          </div>
        </div>

        <!-- confirm: stop server / remove connection -->
        <div
          id="confirm-scrim"
          style="display: none"
          onclick="if (event.target === this) hide('confirm-scrim');"
          class="scrim absolute inset-0 z-30 flex items-start justify-center pt-48"
        >
          <div class="sheet glass-strong rounded-[22px] w-[480px] p-6">
            <div id="confirm-title" class="hl text-xl font-semibold"></div>
            <ul id="confirm-impact" class="mt-3 space-y-2 text-sm"></ul>
            <div id="confirm-note" class="mt-3 text-xs text-muted-foreground"></div>
            <div class="flex justify-end gap-2 mt-5">
              <button
                id="confirm-cancel"
                onclick="hide('confirm-scrim')"
                class="h-9 px-4 rounded-xl text-xs hover:bg-foreground/10 cursor-pointer"
              >
                Cancel
              </button>
              <button
                id="confirm-go"
                onclick="confirmGo()"
                class="h-9 px-4 rounded-xl text-xs bg-rose-600 text-white cursor-pointer"
              ></button>
            </div>
          </div>
        </div>

        <div
          id="int-scrim"
          style="display: none"
          onclick="if (event.target === this) hide('int-scrim');"
          class="scrim absolute inset-0 z-30 flex items-start justify-center pt-32"
        >
          <div id="int-sheet" class="sheet glass rounded-[22px] w-[520px] p-6"></div>
        </div>

        <div
          id="toast"
          style="display: none"
          class="absolute z-40 bottom-6 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-lg pill text-xs"
        ></div>
        <button
          id="version"
          onclick="toast('Update card')"
          class="absolute z-20 bottom-4 right-4 px-2 py-1 rounded-md text-[11px] text-muted-foreground hover:text-foreground cursor-pointer"
        >
          v0.34.0
        </button>
      </div>
    </div>
    <script>
      (function () {
        var h = "";
        for (var i = 0; i < 34; i++) {
          var s = 4 + Math.random() * 14;
          h +=
            '<span class="b" style="left:' +
            Math.random() * 100 +
            "%;width:" +
            s +
            "px;height:" +
            s +
            "px;animation-duration:" +
            (22 + Math.random() * 20) +
            "s;animation-delay:-" +
            Math.random() * 40 +
            's"></span>';
        }
        [
          [170, "6%", 46],
          [230, "74%", 58],
          [120, "42%", 38],
        ].forEach(function (g) {
          h +=
            '<span class="b" style="left:' +
            g[1] +
            ";width:" +
            g[0] +
            "px;height:" +
            g[0] +
            "px;opacity:.18;animation-duration:" +
            g[2] +
            "s;animation-delay:-" +
            g[2] / 2 +
            's"></span>';
        });
        document.getElementById("bubbles").innerHTML = h;
      })();
      var ICON = {
        local: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
        ssh: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
        wsl: '<path d="m5 17 5-5-5-5M12 19h7"/>',
        docker:
          '<path d="M3 12h18c-.5 4.5-4.2 8-9 8s-8.5-3.5-9-8Z"/><path d="M6 12V9h3v3M9 9V6h3v6M12 9h3v3"/>',
        gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
        pen: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14 9l2 2"/>',
        restart: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
        stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
        play: '<path d="m7 4 13 8-13 8Z"/>',
        trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',

          p.n +
          '\')" class="pane ' +
          (p.needs ? "attn " : "") +
          'group/tile relative rounded-2xl p-4 cursor-pointer flex flex-col min-h-[132px]">' +
          '<div class="flex items-start gap-2"><div class="min-w-0"><div class="hl text-[17px] font-semibold truncate">' +
          p.n +
          '</div><div class="text-[11px] text-muted-foreground font-mono truncate">' +
          p.path +
          "</div></div>" +
          '<button id="remove-' +
          p.n +
          '" title="Remove from Home" onclick="event.stopPropagation();removeTile(\'' +
          c.id +
          "','" +
          p.n +
          '\')" class="invisible group-hover/tile:visible absolute top-3 right-3 h-6 w-6 rounded-full grid place-items-center text-muted-foreground hover:bg-foreground/10 hover:text-foreground cursor-pointer">✕</button>' +
          '<span class="ml-auto group-hover/tile:invisible text-[11px] font-medium ' +
          state[1] +
          " " +
          (p.work && !p.needs ? "pulse" : "") +
          '">' +
          state[0] +
          "</span></div>" +
          '<div class="text-xs text-muted-foreground mt-2 h-4 truncate">' +
          (p.needs
            ? '<span class="text-amber-600 dark:text-amber-400">' + p.needs + "</span>"
            : p.auto
              ? p.auto
              : p.here
                ? "Open in this window"
                : p.holder
                  ? "Open on " + p.holder
                  : "") +
          "</div>" +
          '<div class="mt-auto pt-3 flex gap-4">' +
          stat(p.work, "working", "c-work") +
          stat(p.review, "review", "c-review") +
          stat(p.queued, "queued", "") +
          "</div></a>"
        );
      }
      function addProject(c) {
        return (
          '<button id="add-project-' +
          c.id +
          '" onclick="openAdd(\'' +
          c.id +
          '\')" class="ghost rounded-2xl min-h-[132px] flex flex-col items-center justify-center gap-1.5 text-muted-foreground cursor-pointer"><span class="text-2xl leading-none font-light">+</span><span class="text-xs">Add project</span></button>'
        );
      }
      /* right of a connected header: automations running now, nothing otherwise */
      function upNote(c) {
        return c.running
          ? "<span>" + c.running + " automation" + (c.running > 1 ? "s" : "") + " running</span>"
          : "";
      }
      function body(c) {
        if (c.state === "up" && c.min)
          return (
            '<div class="reveal mt-3 flex gap-2 overflow-hidden" style="mask-image:linear-gradient(to right,#000 92%,transparent)">' +
            c.proj
              .slice()
              .sort(function (a, b) {
                return projState(a)[2] - projState(b)[2];
              })
              .map(chip)
              .join("") +
            "</div>"
          );
        if (c.state === "up")
          return (
            '<div class="reveal grid gap-3 mt-4" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">' +
            c.proj
              .map(function (p) {
                return tile(c, p);
              })
              .join("") +
            addProject(c) +
            "</div>"
          );
        if (c.state === "idle") return "";
        if (c.state === "signin")
          return (
            '<form id="signin-form-' +
            c.id +
            '" onsubmit="event.preventDefault();submitSignIn(\'' +
            c.id +
            '\')" class="reveal mt-4 max-w-[520px]">' +
            '<div class="flex gap-2 ' +
            (c.err ? "shake" : "") +
            '"><input id="pw-' +
            c.id +
            '" name="pw-' +
            c.id +
            '" type="password" placeholder="Password for ' +
            c.detail +
            '" class="field flex-1 h-10 px-3.5 rounded-xl text-sm"/>' +
            '<button id="signin-go-' +
            c.id +
            '" class="' +
            BTN +
            ' h-10">Sign in</button>' +
            '<button type="button" id="signin-cancel-' +
            c.id +
            '" onclick="cancelSignIn(\'' +
            c.id +
            '\')" class="h-10 px-3 rounded-xl text-xs text-muted-foreground hover:bg-foreground/10 cursor-pointer">Cancel</button></div>' +
            '<div class="flex items-center gap-4 mt-2 text-[11px] text-muted-foreground"><label class="flex items-center gap-1.5"><input id="remember-' +
            c.id +
            '" name="remember-' +
            c.id +
            '" type="checkbox" checked/> Remember in the system keychain</label>' +
            (c.err
              ? '<span class="text-rose-600 dark:text-rose-400">' + c.err + "</span>"
              : "<span>Or use a key: ⋯ › Change sign-in</span>") +
            "</div></form>"
          );
        if (c.state === "connecting") {
          var steps = [
            c.pw ? "Signing in" : "Reaching " + c.name,
            "Reaching the Maestro server",
            "Reading projects",
          ];
          return (
            '<div class="mt-4 flex items-center gap-5 text-xs">' +
            steps
              .map(function (s, i) {
                return (
                  '<span class="flex items-center gap-1.5 ' +
                  (i > c.step ? "text-muted-foreground" : "") +
                  '">' +
                  (i < c.step
                    ? '<span class="text-emerald-600">✓</span>'
                    : i === c.step
                      ? spinner()
                      : '<span class="h-1.5 w-1.5 rounded-full bg-foreground/20 inline-block"></span>') +
                  s +
                  "</span>"
                );
              })
              .join("") +
            "</div>"
          );
        }
        if (c.state === "stopped")
          return (
            '<div class="mt-4 flex items-center gap-3 text-xs text-muted-foreground"><span>The Maestro server is stopped. Nothing runs here until it starts.</span><button id="start-' +
            c.id +
            '" onclick="startServer(\'' +
            c.id +
            '\')" class="pill rounded-full px-3 py-1.5 text-foreground cursor-pointer hover:bg-foreground/10">Start</button></div>'
          );
        return '<div class="mt-4 text-xs text-muted-foreground">Not answering. Its projects keep their state and come back when it does.</div>';
      }
      function render() {
        var up = CONN.filter(function (c) {
          return c.state === "up";
        });
        var working = 0,
          wait = 0,
          review = 0;
        up.forEach(function (c) {
          c.proj.forEach(function (p) {
            working += p.work;
            wait += p.wait || 0;
            review += p.review;
          });
        });
        $("scores").innerHTML = [
          [working, "working", "c-work"],
          [wait, "need you", "text-amber-600 dark:text-amber-400"],
          [review, "to review", "c-review"],
        ]
          .map(function (s) {
            return (
              '<div><div class="num hl text-[52px] leading-none font-semibold ' +
              (s[0] ? s[2] : "text-muted-foreground/40") +
              '">' +
              s[0] +
              '</div><div class="text-xs text-muted-foreground mt-1">' +
              s[1] +
              "</div></div>"
            );
          })
          .join("");
        $("add-conn-types").innerHTML = TYPES.map(function (t) {
          return (
            '<button id="add-' +
            t[0] +
            '" onclick="openConn(\'' +
            t[0] +
            '\')" class="pane rounded-xl px-4 py-2.5 flex items-center gap-2 text-xs cursor-pointer">' +
            svg(t[0]) +
            t[1] +
            "</button>"
          );
        }).join("");
        drawIntegrations();
        /* attached connections first, then the ones never connected this session, two to a row */
        var order = CONN.filter(function (c) {
          return c.seen;
        }).concat(
          CONN.filter(function (c) {
            return !c.seen;
          }),
        );
        $("connections").innerHTML = order
          .map(function (c) {
            var status =
              c.state === "up"
                ? upNote(c)
                : c.state === "connecting"
                  ? "<span>Connecting…</span>"
                  : c.state === "stopped"
                    ? "<span>Server stopped</span>"
                    : c.state === "idle" || c.state === "signin"
                      ? "<span>Not connected</span>"
                      : '<span class="text-rose-600 dark:text-rose-400">Unreachable</span>';
            var head =
              '<div class="flex items-center gap-3">' +
              '<span class="h-9 w-9 rounded-xl grid place-items-center pill text-muted-foreground">' +
              svg(c.kind, 17) +
              "</span>" +
              '<div class="min-w-0">' +
              (c.editing
                ? '<input id="name-' +
                  c.id +
                  '" name="name-' +
                  c.id +
                  '" value="' +
                  c.name +
                  '" onkeydown="nameKey(event,\'' +
                  c.id +
                  "')\" onblur=\"saveName('" +
                  c.id +
                  '\')" class="field hl text-lg font-semibold h-7 px-2 -ml-2 rounded-lg w-60"/>'
                : '<div class="flex items-center gap-1"><div class="hl text-lg font-semibold leading-tight">' +
                  c.name +
                  "</div>" +
                  (c.kind === "local"
                    ? ""
                    : '<button id="rename-' +
                      c.id +
                      '" onclick="startRename(\'' +
                      c.id +
                      '\')" title="Rename" class="h-6 w-6 rounded-md grid place-items-center text-muted-foreground opacity-0 group-hover:opacity-100 transition-opacity hover:bg-foreground/10 hover:text-foreground cursor-pointer">' +
                      svg("pen", 13) +
                      "</button>") +
                  "</div>") +
              '<div class="text-[11px] text-muted-foreground">' +
              c.detail +
              "</div></div>" +
              '<div class="ml-auto flex items-center gap-4 text-xs text-muted-foreground">' +
              (c.state === "idle"
                ? '<button id="connect-' +
                  c.id +
                  '" onclick="connectTo(\'' +
                  c.id +
                  '\')" class="pill rounded-full px-3 py-1.5 text-foreground cursor-pointer hover:bg-foreground/10">Connect</button>'
                : status +
                  '<span class="menu-wrap relative"><button id="menu-' +
                  c.id +
                  '" onclick="toggleMenu(\'' +
                  c.id +
                  '\')" class="h-7 w-7 rounded-full grid place-items-center cursor-pointer ' +
                  (menuOpen === c.id
                    ? "bg-foreground/10 text-foreground"
                    : "hover:bg-foreground/10") +
                  '">⋯</button>' +
                  (menuOpen === c.id ? menuFor(c) : "") +
                  "</span>") +
              "</div></div>";
            return (
              '<section id="conn-' +
              c.id +
              '" onclick="panelClick(event,\'' +
              c.id +
              '\')" class="group glass rounded-[22px] p-5 relative ' +
              (c.state === "idle" ? "" : "col-span-2 ") +
              (c.state === "up" ? "cursor-pointer " : "") +
              (menuOpen === c.id ? "z-20" : "") +
              " " +
              (c.state === "down" || c.state === "stopped" ? "opacity-75" : "") +
              '">' +
              head +
              body(c) +
              "</section>"
            );
          })
          .join("");
      }
      /* integrations: one tile per provider, a count badge when several, a hover card per tile */
      var PNAME = {
        github: "GitHub",
        gitlab: "GitLab",
        bitbucket: "Bitbucket",
        azuredevops: "Azure DevOps",
        gitea: "Gitea",
        forgejo: "Forgejo",
        jira: "Jira",
        linear: "Linear",
      };
      var PCAPS = {
        github: ["issues", "pull requests"],
        gitlab: ["issues", "merge requests"],
        bitbucket: ["pull requests"],
        azuredevops: ["issues", "pull requests"],
        gitea: ["issues", "pull requests"],
        forgejo: ["issues", "pull requests"],
        jira: ["issues"],
        linear: ["issues"],
      };
      var INT = [
        { p: "github", acc: "billy", host: "github.com", gh: true },
        { p: "github", acc: "emd-release-bot", host: "github.emd.com" },
        { p: "gitlab", acc: "b.rothstein", host: "gitlab.internal" },
        { p: "linear", acc: "acme", host: "linear.app" },
        { p: "jira", acc: "billy@acme.com", host: "acme.atlassian.net" },
      ];
      var intPick = null;
      function bicon(slug, sm) {
        var s = sm ? 16 : 20;
        var fallback =
          "<span class=&quot;grid place-items-center text-[11px] font-semibold&quot; style=&quot;width:" +
          s +
          "px;height:" +
          s +
          "px&quot;>" +
          PNAME[slug][0] +
          "</span>";
        return (
          '<img class="ico' +
          (slug === "github" ? " mono" : "") +
          '" style="width:' +
          s +
          "px;height:" +
          s +
          'px" src="https://cdn.simpleicons.org/' +
          slug +
          '" alt="" onerror="this.outerHTML=\'' +
          fallback +
          "'\"/>"
        );
      }
      function capTags(p) {
        return PCAPS[p]
          .map(function (c) {
            return '<span class="cap">' + c + "</span>";
          })
          .join(" ");
      }
      function intGroups() {
        var g = [],
          m = {};
        INT.forEach(function (i, ix) {
          if (!m[i.p]) {
            m[i.p] = { p: i.p, items: [] };
            g.push(m[i.p]);
          }
          m[i.p].items.push(ix);
        });
        return g;
      }
      function unpin() {
        document.querySelectorAll(".wrap.pinned").forEach(function (w) {
          w.classList.remove("pinned");
        });
        $("integrations").classList.remove("has-pin");
      }
      function togglePin(p) {
        var w = $("wrap-" + p),
          was = w.classList.contains("pinned");
        unpin();
        if (!was) {
          w.classList.add("pinned");
          $("integrations").classList.add("has-pin");
        }
      }
      function intCard(g) {
        var n = g.items.length;
        return (
          '<div class="card"><div class="glass pop w-72 rounded-2xl p-1.5 text-sm">' +
          '<div class="px-2.5 pt-1.5 pb-1 flex items-baseline"><span class="text-xs font-medium">' +
          PNAME[g.p] +
          '</span><span class="ml-auto text-[11px] text-muted-foreground">' +
          n +
          " account" +
          (n > 1 ? "s" : "") +
          '</span></div><div class="mx-2.5 mb-1.5 flex gap-1">' +
          capTags(g.p) +
          "</div>" +
          g.items
            .map(function (ix) {
              var i = INT[ix];
              return (
                '<button id="int-' +
                ix +
                '" onclick="intDetails(' +
                ix +
                ')" class="row">' +
                bicon(i.p, 1) +
                '<span class="min-w-0 flex-1"><span class="block text-xs font-medium truncate">' +
                i.acc +
                (i.gh ? ' <span class="cap">gh cli</span>' : "") +
                '</span><span class="block text-[11px] text-muted-foreground font-mono truncate">' +
                i.host +
                '</span></span><span class="text-muted-foreground text-xs">›</span></button>'
              );
            })
            .join("") +
          '<div class="my-1 h-px bg-foreground/10"></div><button onclick="intForm(\'' +
          g.p +
          '\')" class="row text-xs text-muted-foreground"><span class="w-4 text-center">+</span>Add another ' +
          PNAME[g.p] +
          " account</button></div></div>"
        );
      }
      function drawIntegrations() {
        var g = intGroups();
        $("integrations").classList.remove("has-pin");
        $("integrations").innerHTML =
          '<div class="text-sm font-medium">Integrations</div><div class="text-xs text-muted-foreground mt-0.5">' +
          "Issues and pull requests, for every connection" +
          '</div><div class="flex gap-2.5 mt-4">' +
          g
            .map(function (x) {
              return (
                '<span id="wrap-' +
                x.p +
                '" class="wrap relative"><button id="tile-int-' +
                x.p +
                '" onclick="togglePin(\'' +
                x.p +
                '\')" class="tile pane relative h-[42px] w-[42px] rounded-xl grid place-items-center cursor-pointer">' +
                bicon(x.p) +
                (x.items.length > 1
                  ? '<span class="badge num">' + x.items.length + "</span>"
                  : "") +
                "</button>" +
                intCard(x) +
                "</span>"
              );
            })
            .join("") +
          '<button id="add-integration" onclick="intAdd()" title="Add an integration" class="ghost h-[42px] w-[42px] rounded-xl grid place-items-center text-muted-foreground cursor-pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button></div>';
      }
      function intSheet(eyebrow, title, back, body) {
        unpin();
        $("int-sheet").innerHTML =
          '<div class="flex items-start">' +
          (back
            ? '<button onclick="' +
              back +
              '" class="mr-2 mt-3 h-7 w-7 rounded-full grid place-items-center text-muted-foreground hover:bg-foreground/10 cursor-pointer">‹</button>'
            : "") +
          "<div>" +
          (eyebrow
            ? '<div class="text-[11px] uppercase tracking-[0.14em] text-muted-foreground">' +
              eyebrow +
              "</div>"
            : "") +
          '<div class="hl text-2xl font-semibold mt-0.5">' +
          title +
          '</div></div><button onclick="hide(\'int-scrim\')" class="ml-auto h-7 w-7 rounded-full grid place-items-center text-muted-foreground hover:bg-foreground/10 cursor-pointer">✕</button></div>' +
          body;
        show("int-scrim");
      }
      function intDetails(ix) {
        var i = INT[ix];
        /* one header row: icon, provider, capabilities; the account is a field below */
        intSheet(
          "",
          '<span class="flex items-center gap-3">' +
            bicon(i.p) +
            PNAME[i.p] +
            '<span class="flex gap-1 font-normal tracking-normal">' +
            capTags(i.p) +
            "</span></span>",
          "",
          '<div class="mt-5 space-y-3"><div><div class="text-[11px] text-muted-foreground">Account</div><div class="font-mono text-xs mt-1">' +
            i.acc +
            '</div></div><div><div class="text-[11px] text-muted-foreground">Instance</div><div class="font-mono text-xs mt-1">' +
            i.host +
            "</div></div></div>" +
            (i.gh
              ? '<div class="mt-5 text-xs text-muted-foreground">Managed by the gh CLI. Sign out there to remove it.</div>'
              : '<div class="flex mt-6"><button onclick="intRemove(' +
                ix +
                ')" class="h-9 px-3 rounded-xl text-xs text-rose-600 hover:bg-rose-500/10 cursor-pointer">Disconnect</button><button onclick="toast(\'Edit credentials\')" class="ml-auto ' +
                BTN +
                '">Edit credentials</button></div>'),
        );
      }
      function intRemove(ix) {
        var i = INT[ix];
        INT.splice(ix, 1);
        hide("int-scrim");
        drawIntegrations();
        toast(PNAME[i.p] + " " + i.acc + " disconnected");
      }
      function intAdd() {
        intSheet(
          "Add an integration",
          "Choose a service",
          "",
          '<div class="grid grid-cols-2 gap-2 mt-5">' +
            Object.keys(PNAME)
              .map(function (x) {
                return (
                  '<button id="pick-' +
                  x +
                  '" onclick="intForm(\'' +
                  x +
                  '\',1)" class="pane rounded-xl p-3 flex items-center gap-3 text-left cursor-pointer">' +
                  bicon(x) +
                  '<span><span class="block text-xs font-medium">' +
                  PNAME[x] +
                  '</span><span class="flex gap-1 mt-1">' +
                  capTags(x) +
                  "</span></span></button>"
                );
              })
              .join("") +
            "</div>",
        );
      }
      function intForm(p, fromPicker) {
        intPick = p;
        var url = p !== "github" && p !== "linear";
        intSheet(
          "Add an integration",
          "Connect " + PNAME[p],
          fromPicker ? "intAdd()" : "",
          '<div class="mt-5 space-y-3">' +
            (url
              ? '<div><label class="text-[11px] text-muted-foreground">Instance URL</label><input id="int-url" name="int-url" class="field w-full h-9 px-3 mt-1 rounded-xl text-xs font-mono" placeholder="https://' +
                (p === "jira" ? "yourorg.atlassian.net" : p + ".example.com") +
                '"/></div>'
              : "") +
            '<div><label class="text-[11px] text-muted-foreground">Token</label><input id="int-token" name="int-token" type="password" class="field w-full h-9 px-3 mt-1 rounded-xl text-xs" placeholder="Paste a token"/></div>' +
            '<div class="text-[11px] text-muted-foreground">How to create one ›</div></div><div class="flex mt-6"><button id="int-go" onclick="intAdded()" class="ml-auto ' +
            BTN +
            '">Connect</button></div>',
        );
      }
      function intAdded() {
        INT.push({ p: intPick, acc: "new-account", host: intPick + ".example.com" });
        hide("int-scrim");
        drawIntegrations();
        toast(PNAME[intPick] + " connected");
      }
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".wrap")) unpin();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") unpin();
      });
      render();
    </script>
  </body>
</html>
