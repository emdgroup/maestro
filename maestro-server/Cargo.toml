[package]
name = "maestro-server"
version = "0.30.1"
edition = "2021"
description = "Maestro remote headless server — spawns ACP agents on SSH hosts"
license = "Apache-2.0"

[[bin]]
name = "maestro-server"
path = "src/main.rs"

[dependencies]
maestro-protocol = { path = "../maestro-protocol" }
# Elicitation and terminal authentication are stable as of schema 1.7.0 (tool-call `name` as of 1.8.0), so the
# `unstable_elicitation` / `unstable_auth_methods` flags no longer exist upstream.
agent-client-protocol = "2.2.0"
agent-client-protocol-schema = "1.9.1"
tokio = { version = "1", features = [
  "rt",
  "io-util",
  "io-std",
  "net",
  "sync",
  "macros",
  "process",
  "fs",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
ignore = "0.4"
which = "8.0.2"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.65"
# The webhook listener. All already in the workspace lockfile through the app's own dependencies,
# so no new crate enters the supply chain: an HTTP parser facing the network is not one to hand-roll.
hyper = { version = "1", features = ["http1", "server"] }
# Already in the workspace through the app; here so an MCP server test reaches the URL from the
# machine the agents run on.
reqwest = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
