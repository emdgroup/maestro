[package]
name = "maestro-server"
version = "0.47.0"
edition = "2021"
description = "Maestro remote headless server — spawns ACP agents on SSH hosts"
license = "Apache-2.0"

[[bin]]
name = "maestro-server"
path = "src/main.rs"

[dependencies]
maestro-protocol = { path = "../maestro-protocol", features = ["image", "process"] }
# Elicitation and terminal authentication are stable as of schema 1.7.0 (tool-call `name` as of 1.8.0), and the
# client system prompt as of 1.16.0, so the `unstable_elicitation` / `unstable_auth_methods` /
# `unstable_session_system_prompt` flags no longer exist upstream. The schema is reached through
# `agent_client_protocol::v1::schema` rather than as a dependency of its own: the SDK pins it with `=`.
agent-client-protocol = { version = "5.1.0", features = ["unstable_end_turn_token_usage"] }
tokio = { version = "1", features = [
  "rt",
  "io-util",
  "io-std",
  "net",
  "sync",
  "macros",
  "process",
  "fs",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
ignore = "0.4"
which = "8.0.2"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.65"
# The webhook listener. All already in the workspace lockfile through the app's own dependencies,
# so no new crate enters the supply chain: an HTTP parser facing the network is not one to hand-roll.
hyper = { version = "1", features = ["http1", "server"] }
# Already in the workspace through the app; here so an MCP server test reaches the URL from the
# machine the agents run on.
reqwest = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
# The Auto agent limit measures this machine's free memory, as the app does for a local project.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# A task's image attachments, encoded as the app does; scaling them is maestro-protocol's `image`
# feature. Same version as the app's, so it is already in the lockfile.
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
