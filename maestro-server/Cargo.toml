[package]
name = "maestro-server"
version = "0.22.0"
edition = "2021"
description = "Maestro remote headless server — spawns ACP agents on SSH hosts"
license = "Apache-2.0"

[[bin]]
name = "maestro-server"
path = "src/main.rs"

[dependencies]
maestro-protocol = { path = "../maestro-protocol" }
# Elicitation and terminal authentication are stable as of schema 1.7.0, so the
# `unstable_elicitation` / `unstable_auth_methods` flags no longer exist upstream.
agent-client-protocol = "2.1.0"
agent-client-protocol-schema = "1.7.0"
tokio = { version = "1", features = [
  "rt",
  "io-util",
  "io-std",
  "sync",
  "macros",
  "process",
  "fs",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
ignore = "0.4"
jsonschema = { version = "0.52", default-features = false }
which = "8.0.2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
