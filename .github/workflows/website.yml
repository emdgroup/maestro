name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/**"
      - "docs/custom-agents.md"
      - "CHANGELOG.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # The home page video is kept on the `website-media` release rather than in git. Pages
      # serves it from the site as video/mp4; linking the release directly would not play in
      # Safari, which gets it as application/octet-stream.
      - run: bun run media

      - run: bun run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
