name: Dependency security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ignored advisories, and the reasoning for each, live in
      # .cargo/audit.toml so that a local `cargo audit` behaves identically.
      - run: cargo audit

  bun-audit:
    name: Bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # These four advisories reach only dev and build tooling — wdio, the
      # shadcn CLI, commitlint, and vite's postcss — and none of them ship in
      # the bundle. `bun audit` has no --omit=dev, so they are listed here
      # rather than filtered out. Drop entries as dependency bumps clear
      # them; that belongs in a dependency PR, not a CI one.
      - run: |
          bun audit --audit-level=high \
            --ignore GHSA-5c6j-r48x-rmvq \
            --ignore GHSA-v2hh-gcrm-f6hx \
            --ignore GHSA-mh99-v99m-4gvg \
            --ignore GHSA-r28c-9q8g-f849
