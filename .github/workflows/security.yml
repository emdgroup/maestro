name: Dependency security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ignored advisories, and the reasoning for each, live in
      # .cargo/audit.toml so that a local `cargo audit` behaves identically.
      - run: cargo audit

  bun-audit:
    name: Bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # These five advisories reach only dev and build tooling — wdio, the
      # shadcn CLI, and vite's postcss — and none of them ship in the bundle.
      # `bun audit` has no --omit=dev, so they are listed here rather than
      # filtered out. Drop entries as dependency bumps clear them; that
      # belongs in a dependency PR, not a CI one.
      #
      # The fast-uri, ip-address, js-yaml and nanoid advisories are gone
      # instead of listed: only one major of each is in the tree, so
      # package.json pins the patched version outright. Note nanoid's two
      # advisories have different fixed versions (3.3.16 and 3.3.17) — the
      # pin has to clear the later one. brace-expansion and undici cannot be
      # handled that way — the tree holds several majors of each (1.x, 2.x
      # and 5.x; 6.x and 7.x) and bun applies an override to every instance
      # of a name, so pinning would drag the other consumers across a major.
      - run: |
          bun audit --audit-level=high \
            --ignore GHSA-5c6j-r48x-rmvq \
            --ignore GHSA-mh99-v99m-4gvg \
            --ignore GHSA-rgw5-rvv9-x895 \
            --ignore GHSA-r28c-9q8g-f849 \
            --ignore GHSA-4cwx-7wf7-3272
