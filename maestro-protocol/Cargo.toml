[package]
name = "maestro-protocol"
version = "0.44.0"
edition = "2021"

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
], optional = true }

[features]
# Scaling an image attachment down before it is sent. Off by default, so the crate stays light for
# anyone who only needs the message types.
image = ["dep:image"]
# `NoConsoleWindow` for the processes the app and the daemon spawn.
process = ["tokio/process"]
